# Local environment (FND-024): database, Redis, local S3-compatible storage, backend, web.
# Run through the Makefile (it passes --env-file .env). Ports bind to 127.0.0.1 only.
name: ccp

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ccp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ccp
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccp -d ccp"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_PORT:-6380}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local stand-in for the Wasabi bucket (D-019): SeaweedFS speaks the S3 API.
  # MinIO is not used because its public Docker images are no longer published (D-020).
  storage:
    image: chrislusf/seaweedfs:4.51
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    ports: ["127.0.0.1:${STORAGE_PORT:-8333}:8333"]
    volumes: [storage_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ../backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://ccp:${POSTGRES_PASSWORD}@db:5432/ccp
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ../frontend
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
  redis_data:
  storage_data:
