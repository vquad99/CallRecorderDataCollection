# Conversation Collection on one AWS EC2 server (D-132): web (nginx: the built app and /api to the
# API), api, worker, redis, and Caddy for HTTPS in front. The database is Amazon RDS and the files
# are in S3: neither runs here. Replaces the Render blueprint (render.yaml) once the move is done.
#
#   deploy/aws/deploy.sh        build, migrate, start (or update); the timer runs it on every push
#   deploy/aws/compose.sh ...   any other compose command (it adds the right files and image tag)
#
# Settings and secrets come from deploy/aws/.env (copy env.example; never committed). Only Caddy
# publishes ports. Fixed addresses: web .10 (the only peer the API takes a visitor's address from),
# caddy .20 (the only peer nginx takes it from), api .30 (nginx looks the API up once, at start).
name: ccp

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app: &app
  build: ../../backend
  image: ccp-backend:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    APP_ENV: production
    # RDS; TLS required. The app turns postgresql:// into its own driver's scheme.
    DATABASE_URL: postgresql://${DB_USER:-ccp}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-ccp}?sslmode=require
    REDIS_URL: redis://redis:6379/0
    MEDIA_WORK_DIR: /tmp/media
    FORWARDED_ALLOW_IPS: 172.30.58.10
  restart: unless-stopped
  logging: *logging

services:
  # Work queue and shared sign-in limits; never evicts a queued job (as on Render). Not published.
  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  # Migrations and the first Super Admin (Render's preDeployCommand). deploy.sh runs it before the
  # new containers start, while the old ones still serve.
  migrate:
    <<: *app
    profiles: [tools]
    command: ["python", "-m", "app.cli", "prepare-deploy"]
    restart: "no"

  api:
    <<: *app
    stop_grace_period: 30s
    networks:
      default: { ipv4_address: 172.30.58.30 }
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Processing, call recordings, exports, emails. A job cut off by a restart is sent again
  # (acks_late); most finish within the grace period.
  worker:
    <<: *app
    command: ["sh", "-c", "exec celery -A app.worker worker --loglevel=INFO --concurrency=${WORKER_CONCURRENCY:-2}"]
    stop_grace_period: 2m
    depends_on:
      redis: { condition: service_healthy }

  web:
    build: ../../frontend
    image: ccp-web:${IMAGE_TAG:-latest}
    environment:
      BACKEND_HOSTPORT: api:8000
      # Recordings play from short-lived links on the bucket itself.
      MEDIA_ORIGINS: https://${STORAGE_BUCKET:?set STORAGE_BUCKET in .env}.s3.${STORAGE_REGION:-ap-south-1}.amazonaws.com
      # Caddy (fixed address) passes the visitor's address in X-Real-IP.
      REAL_IP_FROM: 172.30.58.20/32
      REAL_IP_HEADER: X-Real-IP
    networks:
      default: { ipv4_address: 172.30.58.10 }
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  # HTTPS in front of the web container; the only service with public ports (see Caddyfile).
  caddy:
    image: caddy:2.10.2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      TLS: ${TLS:-internal}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default: { ipv4_address: 172.30.58.20 }
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  # PostgreSQL client tools for the database copy, backups and restores (run by the scripts only).
  pgtools:
    image: postgres:16.15-alpine
    profiles: [tools]
    environment:
      PGHOST: ${DB_HOST:-db}
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${DB_USER:-ccp}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${DB_NAME:-ccp}
      PGSSLMODE: require
    restart: "no"
    logging: *logging

networks:
  default:
    ipam:
      config:
        # Fixed addresses above sit below .128; everything else is given an address from .128 up.
        - subnet: 172.30.58.0/24
          ip_range: 172.30.58.128/25

volumes:
  redis_data:
  caddy_data:
  caddy_config:
