# Render Blueprint for Conversation Collection: ONE hosted copy, used for testing and for real work
# (D-081, owner 2026-11-10: "use one..both test n prod"). APP_ENV=production. Blueprint
# `ccp-staging` in the dubdesk Render account (manual sync); address https://dubdesk.live.
# Written from render.com/docs/blueprint-spec and validated against render.com/schema/render.yaml.json.
# Values marked `sync: false` are entered once in the dashboard, never here. Region Singapore = same
# region as the Wasabi bucket.
#
# Shape: a public web service (nginx: the built app + proxy to the API); a PRIVATE API; a background
# worker that turns uploads into delivery files and runs the automatic audio check; a private Key
# Value (Redis) instance the API hands work to and keeps sign-in limits in; a private PostgreSQL
# database. The application refuses to start in production without real email (SMTP), Redis, HTTPS
# and storage keys (app/core/config.py).

services:
  - type: web
    name: ccp-web
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: PORT
        value: "8080"
      - key: BACKEND_HOSTPORT
        fromService:
          type: pserv
          name: ccp-api
          property: hostport
      - key: MEDIA_ORIGINS
        value: https://*.wasabisys.com
      # The visitor's address: Render's proxy is the only way in, and it passes the address
      # Cloudflare saw. Tested on the live copy (2026-11-10): a false X-Forwarded-For dodged the
      # per-address sign-in limit until nginx took the address from CF-Connecting-IP instead.
      - key: REAL_IP_FROM
        value: 0.0.0.0/0
      - key: REAL_IP_HEADER
        value: CF-Connecting-IP

  - type: pserv
    name: ccp-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    # Runs before each deploy goes live: database migrations and the first Super Admin. Demo
    # accounts are never created in production.
    # One command, no shell: Render ran a quoted `sh -c "..."` as a single word (first deploy,
    # 2026-11-10). prepare-deploy runs the steps itself.
    preDeployCommand: python -m app.cli prepare-deploy
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ccp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ccp-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # A Fernet key (32 bytes, URL-safe base64); Render's generated values may not be URL-safe,
      # so it is entered once by hand. Losing it makes stored phone numbers unreadable.
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # https://dubdesk.live; personal links and emails are built from it.
      - key: PUBLIC_APP_URL
        sync: false
      # Only nginx can reach this private service, and nginx sends exactly one address (the
      # visitor's, see ccp-web); so the API may take it from any peer.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: STORAGE_ENDPOINT_URL
        value: https://s3.ap-southeast-1.wasabisys.com
      - key: STORAGE_REGION
        value: ap-southeast-1
      - key: STORAGE_BUCKET
        value: callrec57
      # Kept as `staging/` when this copy became the only one (D-081): every file stored so far
      # lives under it, and the prefix is applied when a file is read.
      - key: STORAGE_KEY_PREFIX
        value: staging/
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_WORK_DIR
        value: /tmp/media
      # Mail (B-13): Resend SMTP from dubdesk.live; host, user, password and sender are entered in
      # the dashboard.
      - key: EMAIL_BACKEND
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOW_DEMO_SEED
        value: "false"

  # Processing and the automatic audio check. The same image as the API; settings are copied from
  # the API so the two can never disagree.
  - type: worker
    name: ccp-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.worker worker --loglevel=INFO --concurrency=2
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ccp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ccp-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: pserv
          name: ccp-api
          envVarKey: SECRET_KEY
      - key: DATA_ENCRYPTION_KEY
        fromService:
          type: pserv
          name: ccp-api
          envVarKey: DATA_ENCRYPTION_KEY
      - key: PUBLIC_APP_URL
        fromService:
          type: pserv
          name: ccp-api
          envVarKey: PUBLIC_APP_URL
      - key: STORAGE_ENDPOINT_URL
        value: https://s3.ap-southeast-1.wasabisys.com
      - key: STORAGE_REGION
        value: ap-southeast-1
      - key: STORAGE_BUCKET
        value: callrec57
      - key: STORAGE_KEY_PREFIX
        value: staging/
      - key: STORAGE_ACCESS_KEY_ID
        fromService:
          type: pserv
          name: ccp-api
          envVarKey: STORAGE_ACCESS_KEY_ID
      - key: STORAGE_SECRET_ACCESS_KEY
        fromService:
          type: pserv
          name: ccp-api
          envVarKey: STORAGE_SECRET_ACCESS_KEY
      - key: MEDIA_WORK_DIR
        value: /tmp/media
      - key: EMAIL_BACKEND
        value: smtp
      - key: SMTP_HOST
        fromService:
          type: pserv
          name: ccp-api
          envVarKey: SMTP_HOST
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        fromService:
          type: pserv
          name: ccp-api
          envVarKey: SMTP_USERNAME
      - key: SMTP_PASSWORD
        fromService:
          type: pserv
          name: ccp-api
          envVarKey: SMTP_PASSWORD
      - key: EMAIL_FROM
        fromService:
          type: pserv
          name: ccp-api
          envVarKey: EMAIL_FROM

  # Work queue and shared sign-in limits. Private network only; never evicts a queued job.
  - type: keyvalue
    name: ccp-redis
    region: singapore
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: ccp-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: ccp
    user: ccp
    ipAllowList: []
