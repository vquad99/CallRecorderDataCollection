[project]
name = "ccp-backend"
version = "0.1.0"
description = "Conversation Collection Platform - backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.118",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "jsonschema>=4.26.0",
    "moto[s3]>=5.2.4",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false
# Only resolve releases at least two weeks old at lock time (stability; TECH_STACK.md).
exclude-newer = "2026-10-26T00:00:00Z"
# Security fixes are not held back by the two-week rule: these two had vulnerabilities published
# on 2026-11-14 (dnspython CVE-2026-128089, opentelemetry-api CVE-2026-126360; found by pip-audit in
# CI) and take the fixed release at once. Remove a line once the date above has passed it.
exclude-newer-package = { dnspython = "2026-11-15T00:00:00Z", opentelemetry-api = "2026-11-15T00:00:00Z" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF", "ASYNC", "PT", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]
"app/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "boto3.*",
    "botocore.*",
    "soxr.*",
    "celery.*",
    "moto.*",
    "soundfile.*",
    "jsonschema.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs a PostgreSQL test database (TEST_DATABASE_URL)"]
addopts = "-ra --strict-markers"
