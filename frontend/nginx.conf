# Serves the built frontend and forwards API and health calls to the backend (same origin).
# Template: the nginx image fills ${MEDIA_ORIGINS} from the environment at start-up.
# Access log without query strings: invitation and password-reset links carry a one-time token in
# the query, and log readers must not be able to use it (security review 2026-11-10).
log_format ccp_no_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent" $request_id';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log ccp_no_query;
    root /usr/share/nginx/html;
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Browsers honour this only over HTTPS; a TLS front end in production makes it effective.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    # Recordings play from short-lived links on the storage service (Wasabi), not from this site:
    # MEDIA_ORIGINS names it (set when the container starts; see frontend/Dockerfile).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' ${MEDIA_ORIGINS}; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Compressed transfer of text files (O11).
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's own random id, so a client cannot choose the reference stored in the audit log.
        proxy_set_header X-Request-ID $request_id;
    }

    # Liveness is public (it says only "up"); readiness names the components, so only private
    # networks (load balancer, monitoring, the host) may ask for it.
    location = /health/live {
        proxy_pass http://backend:8000;
    }
    location /health/ {
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:8000;
        proxy_set_header X-Request-ID $request_id;
    }

    # File names under /assets/ carry a content hash: a browser may keep them for a year (O11).
    # `expires` sets Cache-Control without add_header, so the security headers above still apply.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The page itself is always checked again, so a new release is picked up at once.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
