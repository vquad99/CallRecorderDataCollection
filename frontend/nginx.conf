# Serves the built frontend and forwards API and health calls to the backend (same origin).
# Template: the nginx image fills ${MEDIA_ORIGINS} and ${BACKEND_HOSTPORT} from the environment at
# start-up.
# Access log without query strings: invitation and password-reset links carry a one-time token in
# the query, and log readers must not be able to use it (security review 2026-11-10).
log_format ccp_no_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent" $request_id';

# Request limits per visitor address, before anything reaches the backend (SEC-005 at the edge;
# the API keeps its own per-session limits). An office shares one address, so the API budget is
# generous; audio parts (one every 5 seconds per recording) get a budget of their own, and bursts
# of them (a phone catching up after a dropped connection) are slowed down rather than refused.
limit_req_zone $binary_remote_addr zone=ccp_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ccp_upload:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=ccp_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    # The visitor's address. Locally nobody in front of nginx is trusted (the defaults below match
    # nothing), so $remote_addr is the connecting address. On Render every request arrives through
    # Render's own proxy, which carries the address Cloudflare saw in CF-Connecting-IP; render.yaml
    # sets REAL_IP_FROM / REAL_IP_HEADER so nginx takes it from there (D-077).
    set_real_ip_from ${REAL_IP_FROM};
    real_ip_header ${REAL_IP_HEADER};
    access_log /var/log/nginx/access.log ccp_no_query;
    root /usr/share/nginx/html;
    # The API accepts at most 8 MB (an audio part) and 2.5 MB otherwise; nginx refuses bigger
    # bodies before buffering them (D-088; was 50m). A participant's scanned document may be 10 MB:
    # its own location below (D-144).
    client_max_body_size 9m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Browsers honour this only over HTTPS; a TLS front end in production makes it effective.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    # Recordings play from short-lived links on the storage service (Wasabi), not from this site:
    # MEDIA_ORIGINS names it (set when the container starts; see frontend/Dockerfile).
    # A moderator's page holds their phone seat at TxContact's agent manager over a WebSocket
    # (D-133): connect-src allows that one address besides the site (TXCONTACT_AGENT_URL).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' ${MEDIA_ORIGINS}; connect-src 'self' wss://amber.txcontact.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Compressed transfer of text files (O11).
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # `^~`: the file rules further down never apply to API and health addresses.
    location ^~ /api/ {
        limit_req zone=ccp_api burst=120 nodelay;
        limit_conn ccp_conn 60;
        proxy_pass http://${BACKEND_HOSTPORT};
        proxy_set_header Host $host;
        # One address only, never the client-supplied chain: the API trusts this header from nginx,
        # and a chain would let a visitor put a false address at its start (found on Render).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's own random id, so a client cannot choose the reference stored in the audit log.
        proxy_set_header X-Request-ID $request_id;

        # Audio parts of a face-to-face recording: up to 8 MB each, so fewer at once per address.
        location ~ ^/api/v1/recordings/[^/]+/chunks/[^/]+$ {
            limit_req zone=ccp_upload burst=30;
            limit_conn ccp_conn 16;
            proxy_pass http://${BACKEND_HOSTPORT};
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # A participant's scanned consent form or address proof (D-144): the file is the body, at
        # most 10 MB (10m = 10485760 bytes, participants/documents.MAX_DOCUMENT_BYTES; the API
        # refuses more too).
        location ~ ^/api/v1/projects/[^/]+/participants/[^/]+/documents/(consent-form|address-proof)$ {
            client_max_body_size 10m;
            limit_req zone=ccp_upload burst=10;
            limit_conn ccp_conn 16;
            proxy_pass http://${BACKEND_HOSTPORT};
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }

    # A refusal by the limits above, in the API's own error format.
    error_page 429 = @ccp_too_many;
    location @ccp_too_many {
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Try again shortly.","request_id":"$request_id"}}';
    }
    error_page 413 = @ccp_too_large;
    location @ccp_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"The file or request is too large.","request_id":"$request_id"}}';
    }

    # Liveness is public (it says only "up"); readiness names the components, so only private
    # networks (load balancer, monitoring, the host) may ask for it.
    location = /health/live {
        proxy_pass http://${BACKEND_HOSTPORT};
    }
    location ^~ /health/ {
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://${BACKEND_HOSTPORT};
        proxy_set_header X-Request-ID $request_id;
    }

    # File names under /assets/ carry a content hash: a browser may keep them for a year (O11).
    # `expires` sets Cache-Control without add_header, so the security headers above still apply.
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Hidden files (/.env, /.git/config) and addresses that name a file answer "not found" unless
    # the file is part of the site. Before this they got the app page with "200 OK", which made
    # such addresses look as if they existed and gave phones a web page instead of an icon.
    # The web app manifest, with the type browsers expect (PWA-001).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~* "\.[a-z0-9]{1,12}$" {
        expires -1;
        try_files $uri =404;
    }

    # The page itself is always checked again, so a new release is picked up at once.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
