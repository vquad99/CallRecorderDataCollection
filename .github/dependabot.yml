# Weekly pull requests that move pinned versions forward (SECF-06), so a published advisory in an
# image, an action or a package arrives as a change to review instead of going unnoticed. Minor
# and patch updates of npm and Python packages come together in one pull request each.
# Dependabot does not see the uv tool pins (backend/Dockerfile, the setup-uv steps in
# .github/workflows/ci.yml): move those by hand, together with docs/TECH_STACK.md.
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /deploy/aws
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
