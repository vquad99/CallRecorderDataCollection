# CI runs the same checks as `make check` (FND-028), plus secret, dependency and container checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo:
    name: Repository rules and secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repository rules (TA-GEN-01/03/06/07, TA-ARCH-01)
        run: python3 tools/check_repo.py
      - name: Requirements checklist matches the tracker (D-076)
        run: python3 tools/requirements_checklist.py --check
      - name: Secret scan (TA-SEC-02)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend lint, types, tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ccp
          POSTGRES_PASSWORD: ci-only-db-password
          POSTGRES_DB: ccp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccp -d ccp_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ccp:ci-only-db-password@127.0.0.1:5432/ccp_test
      REQUIRE_DB_TESTS: "1"
      REQUIRE_FFPROBE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.12"
      - name: Install FFmpeg for the independent file check (ffprobe)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install (frozen lockfile)
        run: cd backend && uv sync --frozen
      - name: Format, lint, types, tests
        run: make check-backend UV=uv
      - name: Dependency vulnerability scan (TA-SEC-09)
        run: cd backend && uv run --with pip-audit pip-audit

  frontend:
    name: Frontend lint, types, unit and browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (frozen lockfile)
        run: cd frontend && npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Format, lint, types, unit tests, build
        run: make check-frontend
      - name: Browser tests (TA-FND-15), Chromium and Microsoft Edge
        env:
          # Microsoft Edge comes preinstalled on GitHub's Ubuntu runners; the recorder runs in both.
          PW_EDGE: "1"
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          microsoft-edge --version
          npx playwright test
      - name: Dependency vulnerability scan (TA-SEC-09)
        run: cd frontend && npm audit --audit-level=high

  journeys:
    name: User journeys in a real browser (Option D)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ccp
          POSTGRES_PASSWORD: ci-only-db-password
          POSTGRES_DB: ccp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccp -d ccp"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://ccp:ci-only-db-password@127.0.0.1:5432/ccp
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5181
      PUBLIC_APP_URL: http://127.0.0.1:5181
      EMAIL_BACKEND: file
      EMAIL_FILE_DIR: /tmp/ccp-outbox
      E2E_OUTBOX: /tmp/ccp-outbox
      MEDIA_WORK_DIR: /tmp/ccp-media
      STORAGE_ENDPOINT_URL: http://127.0.0.1:8333
      STORAGE_BUCKET: ccp-journeys
      STORAGE_CREATE_BUCKET: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start S3-compatible file storage (SeaweedFS)
        run: |
          docker run -d --name storage -p 127.0.0.1:8333:8333 -p 127.0.0.1:9333:9333 \
            chrislusf/seaweedfs:4.51 server -dir=/data -s3 -s3.port=8333
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9333/cluster/status >/dev/null && break; sleep 2; done
      - name: Install (frozen lockfiles) and Playwright's Chromium
        run: |
          cd backend && uv sync --frozen && cd ..
          cd frontend && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Keys and passwords for this run only
        run: |
          SECRET="$(openssl rand -hex 32)"; DEMO="ci-$(openssl rand -hex 12)"
          FERNET="$(cd backend && uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          for v in "$SECRET" "$DEMO" "$FERNET"; do echo "::add-mask::$v"; done
          {
            echo "SECRET_KEY=$SECRET"
            echo "DATA_ENCRYPTION_KEY=$FERNET"
            echo "DEMO_PASSWORD=$DEMO"
            echo "E2E_ADMIN_PASSWORD=$DEMO"
            echo "STORAGE_ACCESS_KEY_ID=ci-$(openssl rand -hex 8)"
            echo "STORAGE_SECRET_ACCESS_KEY=ci-$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"
      - name: Migrate, seed one account per role, start the backend
        run: |
          cd backend
          uv run alembic upgrade head
          uv run python -m app.cli seed-dev
          nohup uv run uvicorn app.main:create_app --factory --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health/ready >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health/ready
      - name: Storage contract against SeaweedFS (TA-STOR-10)
        run: |
          cd backend
          CONTRACT_STORAGE_ENDPOINT_URL="$STORAGE_ENDPOINT_URL" CONTRACT_STORAGE_BUCKET="$STORAGE_BUCKET" \
          CONTRACT_STORAGE_ACCESS_KEY_ID="$STORAGE_ACCESS_KEY_ID" \
          CONTRACT_STORAGE_SECRET_ACCESS_KEY="$STORAGE_SECRET_ACCESS_KEY" CONTRACT_STORAGE_PREFIX=contract/ \
          uv run pytest tests/test_storage_contract.py -v -k "real or unreachable"
      - name: User journeys, Chromium and Microsoft Edge
        env:
          PW_EDGE: "1"
        run: cd frontend && npx playwright test --config playwright.journeys.config.ts
      - name: Backend log on failure
        if: failure()
        run: tail -n 300 /tmp/backend.log

  compose:
    name: Containers start, migrate, persist (TM-FND-02)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare .env from the example
        run: |
          cp .env.example .env
          sed -i "s/change-me-local-db-password/ci-$(openssl rand -hex 12)/g; s/change-me-change-me-change-me-change-me-0000/ci-$(openssl rand -hex 24)/" .env
          sed -i "s|^DATA_ENCRYPTION_KEY=.*|DATA_ENCRYPTION_KEY=$(make -s key)|" .env
      - name: Start every service and wait for health checks
        run: docker compose --env-file .env -f infra/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Run migrations as a separate step
        run: docker compose --env-file .env -f infra/docker-compose.yml run --rm backend alembic upgrade head
      - name: Backend ready (database + Redis) directly and through the web server
        run: |
          curl -fsS http://127.0.0.1:8000/health/ready | tee /dev/stderr | grep -q '"status":"ready"'
          curl -fsS http://127.0.0.1:8080/health/ready | grep -q '"status":"ready"'
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/api/v1/version | grep -q '"version"'
      - name: Web server compression, caching and audio policy (O11)
        run: |
          ASSET="$(curl -fsS http://127.0.0.1:8080/ | grep -o '/assets/index-[^"]*\.js' | head -1)"
          test -n "$ASSET"
          curl -fsS -D /tmp/asset.txt -o /dev/null -H 'Accept-Encoding: gzip' "http://127.0.0.1:8080$ASSET"
          cat /tmp/asset.txt
          grep -qi '^cache-control: max-age=31536000' /tmp/asset.txt
          grep -qi '^content-encoding: gzip' /tmp/asset.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/asset.txt
          grep -qi "media-src 'self' https://\*.wasabisys.com" /tmp/asset.txt
          curl -fsS -D /tmp/page.txt -o /dev/null http://127.0.0.1:8080/tasks
          grep -qi '^cache-control: no-cache' /tmp/page.txt
      - name: Data survives a database restart
        run: |
          C="docker compose --env-file .env -f infra/docker-compose.yml"
          $C exec -T db psql -U ccp -d ccp -c "INSERT INTO system_settings (key, value_type, value_text) VALUES ('ci.persistence', 'text', 'kept')"
          $C restart db
          $C exec -T db sh -c 'until pg_isready -U ccp -d ccp; do sleep 1; done'
          $C exec -T db psql -U ccp -d ccp -Atc "SELECT value_text FROM system_settings WHERE key = 'ci.persistence'" | grep -qx kept
      - name: Backup to storage, lose data, restore (O9; TM-SEC-03 locally)
        run: |
          C="docker compose --env-file .env -f infra/docker-compose.yml"
          $C exec -T db psql -U ccp -d ccp -c "INSERT INTO system_settings (key, value_type, value_text) VALUES ('ci.backup', 'text', 'kept')"
          ENV_FILE=.env infra/backup/backup.sh | tee /tmp/backup.out
          KEY="$(awk '/^backup-upload:/ {print $2}' /tmp/backup.out)"
          test -n "$KEY"
          $C exec -T db psql -U ccp -d ccp -c "DELETE FROM system_settings WHERE key = 'ci.backup'"
          ENV_FILE=.env infra/backup/restore.sh "$KEY"
          $C exec -T db psql -U ccp -d ccp -Atc "SELECT value_text FROM system_settings WHERE key = 'ci.backup'" | grep -qx kept
          $C up -d --wait --wait-timeout 120 backend worker
          curl -fsS http://127.0.0.1:8000/health/ready | grep -q '"status":"ready"'
      - name: Worker running; storage adapter round trip against SeaweedFS
        run: |
          C="docker compose --env-file .env -f infra/docker-compose.yml"
          test "$($C ps worker --format '{{.State}}')" = running
          $C exec -T backend python -c "
          import hashlib
          from app.core.config import load_settings
          from app.core.storage import build_storage
          s = build_storage(load_settings())
          data = b'ci-storage-check'
          h = hashlib.sha256(data).hexdigest()
          s.put_bytes('ci/check.bin', data, content_type='application/octet-stream', sha256=h)
          info = s.head('ci/check.bin')
          assert info and info.size == len(data) and info.sha256 == h, info
          s.delete('ci/check.bin')
          assert s.head('ci/check.bin') is None
          print('storage round trip ok')
          "
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/docker-compose.yml logs --no-color --tail 200
